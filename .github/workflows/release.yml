name: Release 64-bit APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_name:
        description: 'Release Title'
        required: true
        default: 'GitPulse v1.0.1 (64-bit ARM)'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Official release bundle compiled exclusively for 64-bit ARM architecture (arm64-v8a).'
      draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish 64-bit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build 64-bit Release APK (ARM64 Only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Package & Prepare Release Artifacts
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          APK_NAME="GitPulse-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.release_notes }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
