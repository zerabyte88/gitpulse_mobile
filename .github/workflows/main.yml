name: GitPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_name:
        description: 'Release Title'
        required: true
        default: 'GitPulse v1.0.1 (64-bit ARM)'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Official release bundle compiled exclusively for 64-bit ARM architecture (arm64-v8a).'
      publish_to_release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Test, Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Build 64-bit Release APK (ARM64 Only)
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        id: prep
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "master" ] || [ "$RAW_TAG" = "main" ]; then
            TAG="v1.0.1"
          else
            TAG="$RAW_TAG"
          fi
          APK_NAME="GitPulse-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.apk_name }}
          path: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256

      - name: Publish to GitHub Releases
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to_release) || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: ${{ inputs.release_name || steps.prep.outputs.tag_name }}
          body: ${{ inputs.release_notes || 'Official GitPulse Mobile release bundle.' }}
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.apk_name }}
            ${{ steps.prep.outputs.apk_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
